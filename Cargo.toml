[package]
name = "schnapsen"
version = "0.1.0"
edition = "2021"
default-run = "schnapsen"

[dependencies]
adw = { optional = true, package = "libadwaita", version = "0.7", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["gui"]
gui = ["dep:adw"]

[[bin]]
name = "schnapsen"
path = "src/main.rs"
required-features = ["gui"]
